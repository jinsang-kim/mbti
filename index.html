<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 진짜 성격 여행</title>
<!-- 카카오톡·인스타 등에 링크를 보낼 때 보이는 미리보기 정보 -->
<meta name="description" content="명작 속 주인공이 되어 알아보는 나만의 성격 유형 📚💖 12문항 · 약 3분 · 16가지 유형">
<meta name="theme-color" content="#ffc8de">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="나의 진짜 성격 여행">
<meta property="og:title" content="나의 진짜 성격을 찾아 떠나는 여행 🌈">
<meta property="og:description" content="명작 속 주인공이 되어 알아보는 나만의 성격 유형 📚💖 12문항 · 약 3분">
<meta property="og:url" content="https://mbti-jjin5.vercel.app/">
<meta property="og:image" content="https://mbti-jjin5.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="나의 진짜 성격을 찾아 떠나는 여행 - 파스텔톤 성격 유형 검사">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     디자인 토큰
     ========================================================= */
  :root {
    --pink: #ffc8de;
    --pink-deep: #ff8fb8;
    --lavender: #dccbff;
    --lavender-deep: #a98bff;
    --sky: #c6e4ff;
    --sky-deep: #79b8ff;
    --mint: #c3f2e1;
    --mint-deep: #5fd3a9;
    --peach: #ffd9c2;
    --text: #5b4a73;
    --text-soft: #8a7aa3;
    --card: rgba(255, 255, 255, 0.82);
    --card-solid: #ffffff;
    --shadow: 0 10px 30px rgba(155, 120, 200, 0.22);
    --shadow-soft: 0 4px 14px rgba(155, 120, 200, 0.16);
    --radius: 28px;
    --theme-a: var(--pink-deep);
    --theme-b: var(--lavender-deep);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    font-family: 'Gaegu', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 700;
    color: var(--text);
    background: linear-gradient(135deg, #ffd6e8 0%, #e6d9ff 33%, #cfe9ff 66%, #c9f5e6 100%);
    background-size: 300% 300%;
    animation: bgShift 18s ease-in-out infinite;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  h1, h2, h3, .jua, button { font-family: 'Jua', sans-serif; font-weight: 400; }

  /* =========================================================
     배경 장식 (떠다니는 별/하트/구름/반짝이)
     ========================================================= */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .deco {
    position: absolute;
    bottom: -60px;
    user-select: none;
    animation: floatUp linear infinite;
    will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(18px, -30vh) rotate(10deg); }
    50%  { transform: translate(-14px, -60vh) rotate(-8deg); }
    75%  { transform: translate(14px, -90vh) rotate(6deg); }
    100% { transform: translate(0, -125vh) rotate(0deg); }
  }
  .twinkle {
    position: absolute;
    color: #fff;
    animation: twinkle ease-in-out infinite;
    text-shadow: 0 0 8px rgba(255,255,255,.9);
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.7); }
    50% { opacity: .9; transform: scale(1.1); }
  }

  /* =========================================================
     레이아웃 & 화면 전환
     ========================================================= */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; animation: fadeIn .5s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 2px solid rgba(255,255,255,.9);
    padding: 28px 22px;
  }

  /* 공통 버튼 */
  .btn {
    border: none;
    cursor: pointer;
    font-size: 1.25rem;
    padding: 16px 28px;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, var(--pink-deep), var(--lavender-deep));
    box-shadow: 0 8px 20px rgba(255, 143, 184, .4);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 10px 26px rgba(255, 143, 184, .5); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn.secondary {
    background: #fff;
    color: var(--lavender-deep);
    box-shadow: var(--shadow-soft);
  }

  /* =========================================================
     시작 화면
     ========================================================= */
  #start { justify-content: center; text-align: center; gap: 22px; }
  .hero-emoji { font-size: 4.2rem; animation: bob 3s ease-in-out infinite; display: inline-block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }
  .badge {
    display: inline-block;
    font-family: 'Jua', sans-serif;
    font-size: .95rem;
    background: #fff;
    color: var(--pink-deep);
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: var(--shadow-soft);
  }
  #start h1 {
    font-size: 2.3rem;
    line-height: 1.25;
    background: linear-gradient(135deg, #ff6fa5, #9a7bff 60%, #5aa9ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 10px 0 12px;
  }
  #start .intro { font-size: 1.3rem; line-height: 1.5; color: var(--text-soft); }
  .start-meta { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .start-meta span {
    font-size: 1.1rem;
    background: rgba(255,255,255,.7);
    padding: 6px 12px;
    border-radius: 14px;
  }
  #start .btn { font-size: 1.4rem; padding: 18px 40px; align-self: center; }

  /* =========================================================
     문항 화면
     ========================================================= */
  .quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-btn {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: var(--lavender-deep);
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .back-btn:hover { transform: scale(1.1); }
  .back-btn:active { transform: scale(.94); }
  .progress-wrap { flex: 1; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-family: 'Jua', sans-serif;
    font-size: 1rem;
    margin-bottom: 6px;
    color: var(--text-soft);
  }
  .progress-label b { color: var(--pink-deep); font-weight: 400; }
  .progress-track {
    height: 14px;
    background: rgba(255,255,255,.75);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(150,120,200,.15);
  }
  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--pink-deep), var(--lavender-deep), var(--sky-deep));
    transition: width .4s ease;
    position: relative;
  }
  .progress-fill::after {
    content: '✨';
    position: absolute; right: -4px; top: 50%;
    transform: translateY(-50%);
    font-size: .8rem;
  }

  .q-card { text-align: center; }
  .q-card.anim { animation: fadeIn .4s ease both; }
  .q-emoji { font-size: 3rem; margin-bottom: 8px; }
  .q-num { font-family: 'Jua', sans-serif; color: var(--lavender-deep); font-size: 1rem; margin-bottom: 10px; }
  .q-book { font-size: 1.5rem; color: var(--pink-deep); word-break: keep-all; }
  .q-scene { font-family: 'Jua', sans-serif; font-size: 1.1rem; color: var(--text-soft); margin-top: 2px; word-break: keep-all; }
  .q-text { font-size: 1.25rem; line-height: 1.5; word-break: keep-all; margin-top: 14px; }

  .options { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%;
    border: 2px solid transparent;
    background: #fff;
    color: var(--text);
    font-family: 'Gaegu', sans-serif;
    font-weight: 700;
    font-size: 1.18rem;
    line-height: 1.45;
    word-break: keep-all;
    padding: 14px 16px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    text-align: left;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s;
  }
  .opt .dot {
    flex-shrink: 0;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 3px solid var(--c);
    background: #fff;
    color: var(--c);
    font-family: 'Jua', sans-serif;
    font-size: 1rem;
    transition: background .2s;
  }
  .opt:hover { transform: scale(1.02); border-color: var(--c); }
  .opt:active { transform: scale(.98); }
  .opt.selected { background: var(--c); color: #fff; border-color: var(--c); }
  .opt.selected .dot { background: #fff; }

  /* =========================================================
     로딩 화면
     ========================================================= */
  #loading { justify-content: center; align-items: center; text-align: center; gap: 18px; }
  .spinner { font-size: 4rem; animation: spin 1.4s ease-in-out infinite; display: inline-block; }
  @keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
  #loading p { font-family: 'Jua', sans-serif; font-size: 1.4rem; }

  /* =========================================================
     결과 화면
     ========================================================= */
  #result { gap: 16px; }
  .result-hero {
    position: relative;
    text-align: center;
    padding: 30px 22px 26px;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,.9) 0 8%, transparent 9%),
      radial-gradient(circle at 85% 25%, rgba(255,255,255,.7) 0 5%, transparent 6%),
      linear-gradient(160deg, #fff 0%, rgba(255,255,255,.85) 45%, rgba(255,255,255,.6) 100%);
  }
  .result-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(160deg, var(--theme-a), var(--theme-b));
    opacity: .28;
    z-index: -1;
  }
  .result-hero { isolation: isolate; }
  .hero-sparkles { position: absolute; inset: 0; pointer-events: none; font-size: 1.1rem; }
  .hero-sparkles span { position: absolute; animation: twinkle 2.6s ease-in-out infinite; }
  .result-kicker { font-family: 'Jua', sans-serif; font-size: 1.05rem; color: var(--text-soft); }
  .result-img {
    display: block;
    width: 180px; height: 180px;
    margin: 14px auto 8px;
    object-fit: cover;
    border-radius: 24px;
    border: 4px solid #fff;
    box-shadow: var(--shadow);
  }
  .result-type {
    font-family: 'Jua', sans-serif;
    font-size: 4.2rem;
    letter-spacing: 6px;
    line-height: 1.1;
    background: linear-gradient(135deg, var(--theme-a), var(--theme-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 rgba(255,255,255,.9));
  }
  .result-nick {
    display: inline-block;
    margin-top: 8px;
    font-family: 'Jua', sans-serif;
    font-size: 1.35rem;
    color: #fff;
    background: linear-gradient(135deg, var(--theme-a), var(--theme-b));
    padding: 8px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(170,130,220,.35);
  }
  .result-summary { margin-top: 16px; font-size: 1.25rem; line-height: 1.5; word-break: keep-all; }
  .result-book { font-family: 'Jua', sans-serif; font-size: 1.05rem; color: var(--text-soft); margin-top: 8px; }

  /* 지표 막대 그래프 */
  .bars { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .bar-row .bar-labels {
    display: flex; justify-content: space-between;
    font-size: 1.1rem; margin-bottom: 5px; color: var(--text-soft);
  }
  .bar-row .bar-labels .win { color: var(--text); font-family: 'Jua', sans-serif; font-size: 1.15rem; }
  .bar-track {
    height: 16px;
    border-radius: 999px;
    background: rgba(255,255,255,.95);
    box-shadow: inset 0 2px 4px rgba(150,120,200,.18);
    overflow: hidden;
    display: flex;
  }
  .bar-left, .bar-right { height: 100%; width: 0; transition: width 1s cubic-bezier(.22,1,.36,1); }
  .bar-left { background: linear-gradient(90deg, var(--theme-a), var(--theme-b)); border-radius: 999px 0 0 999px; }
  .bar-right { margin-left: auto; background: linear-gradient(90deg, #e8e0f7, #d9e6f7); border-radius: 0 999px 999px 0; }
  .bar-row.right-win .bar-left { background: linear-gradient(90deg, #f3dce8, #e8e0f7); }
  .bar-row.right-win .bar-right { background: linear-gradient(90deg, var(--theme-b), var(--theme-a)); }
  .shared-note {
    margin-top: 18px; font-size: 1.15rem; line-height: 1.45;
    background: rgba(255,255,255,.8); border-radius: 18px; padding: 12px 14px;
  }
  .shared-note .link-btn {
    margin-top: 8px;
    border: none; background: none; cursor: pointer;
    font-size: 1.1rem; color: var(--lavender-deep);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .bar-row.tie .bar-labels span { color: var(--text); }
  .tie-note { margin-top: 4px; font-size: 1.1rem; }

  .info-card h3 { font-size: 1.3rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .info-card { padding: 22px 20px; }

  .match-list { display: flex; gap: 10px; flex-wrap: wrap; }
  .match-chip {
    flex: 1 1 120px;
    background: #fff;
    border-radius: 20px;
    padding: 12px;
    text-align: center;
    box-shadow: var(--shadow-soft);
    border: none;
    cursor: pointer;
    color: var(--text);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .match-chip:hover { transform: scale(1.05); }
  .match-chip .m-img { width: 72px; height: 72px; object-fit: cover; border-radius: 16px; display: block; margin: 0 auto 6px; }
  .match-chip .m-type { font-family: 'Jua', sans-serif; font-size: 1.3rem; color: var(--lavender-deep); }
  .match-chip .m-nick { font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 1rem; color: var(--text-soft); display: block; }

  .share-btn { width: 100%; font-size: 1.25rem; }
  .result-actions { display: flex; gap: 10px; }
  .result-actions .btn { flex: 1; font-size: 1.15rem; padding: 16px 12px; }

  /* 토스트 */
  .toast {
    position: fixed; left: 50%; bottom: 40px;
    transform: translate(-50%, 30px);
    background: rgba(91,74,115,.92);
    color: #fff;
    font-family: 'Jua', sans-serif;
    padding: 12px 22px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 10;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 하단 안내 */
  footer {
    position: relative; z-index: 1;
    text-align: center;
    font-size: .95rem;
    color: var(--text-soft);
    padding: 14px 16px 20px;
    line-height: 1.4;
    word-break: keep-all;
  }

  @media (min-width: 768px) {
    main { padding-top: 48px; }
    #start h1 { font-size: 2.8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .deco { display: none; }
  }
</style>
</head>
<body>

<!-- 배경 장식이 들어갈 곳 (JS로 생성) -->
<div class="sky" id="sky" aria-hidden="true"></div>

<main>
  <!-- ===================== 1) 시작 화면 ===================== -->
  <section class="screen active" id="start">
    <div class="card">
      <span class="hero-emoji">🎒</span>
      <div><span class="badge">✨ 마음 여행 티켓 ✨</span></div>
      <h1>나의 진짜 성격을<br>찾아 떠나는 여행</h1>
      <p class="intro">명작 속 주인공이 되어<br>알아보는 나만의 성격 유형 📚💖<br>솔직하게 답할수록 정확해져요!</p>
      <div class="start-meta">
        <span>📝 12문항</span>
        <span>⏱️ 약 3분</span>
        <span>🌈 16가지 유형</span>
      </div>
    </div>
    <button class="btn" id="startBtn">검사 시작하기 🚀</button>
  </section>

  <!-- ===================== 2) 문항 화면 ===================== -->
  <section class="screen" id="quiz">
    <div class="quiz-top">
      <button class="back-btn" id="backBtn" aria-label="이전 문항으로">←</button>
      <div class="progress-wrap">
        <div class="progress-label"><span>마음 여행 중 🧭</span><span><b id="progNow">1</b> / <span id="progTotal">12</span></span></div>
        <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
      </div>
    </div>
    <div class="card q-card" id="qCard">
      <div class="q-emoji" id="qEmoji">💬</div>
      <div class="q-num" id="qNum">Q1</div>
      <h2 class="q-book" id="qBook"></h2>
      <p class="q-scene" id="qScene"></p>
      <p class="q-text" id="qText"></p>
    </div>
    <div class="options" id="options"></div>
  </section>

  <!-- ===================== 로딩 ===================== -->
  <section class="screen" id="loading">
    <span class="spinner">🔮</span>
    <p>너의 마음 지도를 그리는 중...</p>
  </section>

  <!-- ===================== 3) 결과 화면 ===================== -->
  <section class="screen" id="result">
    <div class="card result-hero" id="resultHero">
      <div class="hero-sparkles" aria-hidden="true">
        <span style="left:8%;top:10%">✨</span>
        <span style="right:10%;top:14%;animation-delay:.6s">💫</span>
        <span style="left:12%;bottom:30%;animation-delay:1.2s">⭐</span>
        <span style="right:8%;bottom:38%;animation-delay:1.8s">💖</span>
      </div>
      <p class="result-kicker" id="resultKicker">나의 진짜 성격은...</p>
      <img class="result-img" id="resultImg" src="" alt="">
      <div class="result-type" id="resultType">ENFP</div>
      <div class="result-nick" id="resultNick"></div>
      <p class="result-book" id="resultBook"></p>
      <p class="result-summary" id="resultSummary"></p>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card info-card">
      <h3>💞 찰떡궁합 유형</h3>
      <div class="match-list" id="resMatches"></div>
    </div>

    <!-- 휴대폰 공유 창(Web Share API)을 지원하는 브라우저에서만 보임 -->
    <button class="btn share-btn" id="shareBtn" hidden>친구에게 공유하기 📤</button>
    <div class="result-actions">
      <button class="btn secondary" id="retryBtn">다시 검사하기 🔄</button>
      <button class="btn" id="copyBtn">결과 링크 복사 🔗</button>
    </div>
  </section>
</main>

<footer>⚠️ 이 검사는 재미로 보는 비공식 성격 검사이며, 공식 MBTI® 검사가 아닙니다</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   데이터 로드
   ========================================================= */
const DIMENSIONS = JSON.parse(document.getElementById('data-dimensions').textContent);
const QUESTIONS  = JSON.parse(document.getElementById('data-questions').textContent);
const TYPES      = JSON.parse(document.getElementById('data-types').textContent);

// 유형 그룹별 결과 화면 색 테마
const THEMES = {
  NF: ['#ff8fb8', '#a98bff'],
  NT: ['#a98bff', '#79b8ff'],
  SJ: ['#79b8ff', '#5fd3a9'],
  SP: ['#ff9f8f', '#ff8fb8']
};

// 선택지 A / B 색
const OPTION_COLORS = ['#ff8fb8', '#79b8ff'];

const STORAGE_KEY = 'mbti-trip-last-result';

/* =========================================================
   점수 계산 로직
   ========================================================= */

/**
 * 지표별 원점수를 계산한다.
 * - 고른 선택지의 pole이 지표의 왼쪽 글자(E/S/T/J)면 +1, 오른쪽 글자(I/N/F/P)면 -1.
 * - 결과: 양수일수록 왼쪽 성향, 음수일수록 오른쪽 성향.
 * @param {(string|null)[]} answers 문항 순서대로 고른 선택지의 pole 배열
 * @returns {{[dimKey: string]: {raw: number, max: number}}}
 */
function calculateRawScores(answers) {
  const scores = {};
  DIMENSIONS.forEach(d => { scores[d.key] = { raw: 0, max: 0 }; });

  QUESTIONS.forEach((q, i) => {
    const dim = DIMENSIONS.find(d => d.key === q.dim);
    if (answers[i] === dim.left) scores[q.dim].raw += 1;
    else if (answers[i] === dim.right) scores[q.dim].raw -= 1;
    scores[q.dim].max += 1; // 문항당 1점
  });
  return scores;
}

/**
 * 원점수를 왼쪽 성향의 백분율(0~100)로 바꾼다.
 * raw = +max 이면 100%, 0 이면 50%, -max 이면 0%.
 * @returns {{[dimKey: string]: number}} 왼쪽 글자의 비율(%)
 */
function toPercentages(rawScores) {
  const pct = {};
  Object.entries(rawScores).forEach(([key, s]) => {
    pct[key] = Math.round(50 + (s.raw / s.max) * 50);
  });
  return pct;
}

/**
 * 백분율에서 4글자 유형을 만든다.
 * 정확히 50%로 동점이면 오른쪽 글자(I/N/F/P)를 택하고,
 * 결과 화면에서 "반반"이라고 따로 알려준다.
 */
function getTypeCode(pct) {
  return DIMENSIONS.map(d => (pct[d.key] > 50 ? d.left : d.right)).join('');
}

/* =========================================================
   상태 & 화면 전환
   ========================================================= */
const state = {
  current: 0,
  answers: new Array(QUESTIONS.length).fill(null),
  locked: false   // 자동 넘김 애니메이션 중 중복 클릭 방지
};

const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   문항 화면
   ========================================================= */
function renderQuestion() {
  const q = QUESTIONS[state.current];
  const total = QUESTIONS.length;

  $('progNow').textContent = state.current + 1;
  $('progTotal').textContent = total;
  $('progFill').style.width = ((state.current + 1) / total * 100) + '%';

  // 카드 페이드 애니메이션 재시작
  const card = $('qCard');
  card.classList.remove('anim');
  void card.offsetWidth;
  card.classList.add('anim');

  $('qEmoji').textContent = q.emoji;
  $('qNum').textContent = 'Q' + (state.current + 1);
  $('qBook').textContent = `《${q.book}》`;
  $('qScene').textContent = q.scene;
  $('qText').textContent = q.situation;

  const box = $('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (state.answers[state.current] === opt.pole ? ' selected' : '');
    btn.style.setProperty('--c', OPTION_COLORS[i]);
    btn.innerHTML = `<span class="dot">${'AB'[i]}</span><span class="opt-text"></span>`;
    btn.querySelector('.opt-text').textContent = opt.text;
    btn.addEventListener('click', () => selectAnswer(opt.pole, btn));
    box.appendChild(btn);
  });
}

function selectAnswer(pole, btn) {
  if (state.locked) return;
  state.locked = true;
  state.answers[state.current] = pole;
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  // 살짝 기다렸다가 자동으로 다음 문항
  setTimeout(() => {
    state.locked = false;
    if (state.current < QUESTIONS.length - 1) {
      state.current++;
      renderQuestion();
    } else {
      finishTest();
    }
  }, 280);
}

function goBack() {
  if (state.locked) return;
  if (state.current === 0) { showScreen('start'); return; }
  state.current--;
  renderQuestion();
}

function startTest() {
  state.current = 0;
  state.answers.fill(null);
  history.replaceState(null, '', location.pathname + location.search);
  renderQuestion();
  showScreen('quiz');
}

function finishTest() {
  const pct = toPercentages(calculateRawScores(state.answers));
  const type = getTypeCode(pct);
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ type, pct })); } catch (e) {}

  showScreen('loading');
  setTimeout(() => {
    history.replaceState(null, '', '#' + type);
    renderResult(type, pct, 'mine');
  }, 1300);
}

/* =========================================================
   결과 화면
   ========================================================= */
const KICKERS = {
  mine:   '나의 진짜 성격은...',
  shared: '친구가 공유한 성격 유형 💌',
  browse: '찰떡궁합 유형 구경 중 👀'
};

/**
 * @param {string} type  예: "ENFP"
 * @param {object|null} pct  지표별 왼쪽 비율. 내 결과가 아니면 null
 * @param {'mine'|'shared'|'browse'} mode
 *   mine: 내가 검사한 결과 / shared: 공유 링크로 들어옴 / browse: 궁합 카드를 눌러 구경 중
 */
function renderResult(type, pct, mode) {
  const t = TYPES[type];
  const [a, b] = THEMES[t.group];
  document.documentElement.style.setProperty('--theme-a', a);
  document.documentElement.style.setProperty('--theme-b', b);

  $('resultKicker').textContent = KICKERS[mode];
  $('resultImg').src = t.image;
  $('resultImg').alt = `${t.character} (${t.book})`;
  $('resultType').textContent = type;
  $('resultNick').textContent = t.character;
  $('resultBook').textContent = `《${t.book}》`;
  $('resultSummary').textContent = t.summary;
  document.title = `${type} ${t.character} | 나의 진짜 성격 여행`;

  // 지표 막대 그래프
  const bars = $('bars');
  bars.innerHTML = '';
  if (pct) {
    const ties = [];
    DIMENSIONS.forEach(d => {
      const left = pct[d.key], right = 100 - left;
      const leftWin = type.includes(d.left);
      const tie = left === 50;
      if (tie) ties.push(d);
      const row = document.createElement('div');
      row.className = 'bar-row' + (leftWin ? '' : ' right-win') + (tie ? ' tie' : '');
      row.innerHTML =
        `<div class="bar-labels">
           <span class="${leftWin ? 'win' : ''}">${d.left} ${d.leftName} ${left}%</span>
           ${tie ? '<span>⚖️ 반반</span>' : ''}
           <span class="${leftWin ? '' : 'win'}">${right}% ${d.rightName} ${d.right}</span>
         </div>
         <div class="bar-track"><div class="bar-left"></div><div class="bar-right"></div></div>`;
      bars.appendChild(row);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.querySelector('.bar-left').style.width = left + '%';
        row.querySelector('.bar-right').style.width = right + '%';
      }));
    });
    if (ties.length) {
      const names = ties.map(d => `${d.left}/${d.right}`).join(', ');
      const picked = ties.map(d => d.right).join(', ');
      const note = document.createElement('p');
      note.className = 'shared-note tie-note';
      note.textContent = `⚖️ ${names} 지표는 딱 반반이에요! 두 성향을 모두 가지고 있어서, 이번 결과에선 ${picked}(으)로 정했어요.`;
      bars.appendChild(note);
    }
  } else if (mode === 'browse') {
    bars.innerHTML = `<p class="shared-note">💞 나와 잘 맞는 유형을 구경하고 있어요!<br><button class="link-btn" id="backToMine">← 이전 결과로 돌아가기</button></p>`;
    $('backToMine').addEventListener('click', () => history.back());
  } else {
    bars.innerHTML = `<p class="shared-note">🧭 지표별 비율은 직접 검사해야 볼 수 있어요!<br>나는 어떤 유형일까? 아래 버튼으로 떠나보자 ✨</p>`;
  }

  // 잘 맞는 유형 (누르면 그 유형 설명 보기)
  const m = $('resMatches');
  m.innerHTML = '';
  t.matches.forEach(code => {
    const mt = TYPES[code];
    const chip = document.createElement('button');
    chip.className = 'match-chip';
    chip.innerHTML = `<img class="m-img" src="${mt.image}" alt=""><span class="m-type">${code}</span><span class="m-nick">${mt.character}</span>`;
    chip.addEventListener('click', () => {
      browseNext = true;   // 다음 해시 이동은 "구경" 모드로
      location.hash = code;
    });
    m.appendChild(chip);
  });

  $('retryBtn').textContent = mode === 'shared' ? '나도 검사하기 🚀' : '다시 검사하기 🔄';
  showScreen('result');
}

// 궁합 카드를 눌러서 생긴 해시 이동인지 표시하는 플래그
let browseNext = false;

/** URL 해시(#ENFP)를 읽어 결과 화면으로 바로 이동 */
function routeFromHash() {
  const code = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (!TYPES[code]) return false;

  // 내가 방금 검사한 결과와 같으면 비율까지 보여주기
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY)); } catch (e) {}
  const browsing = browseNext;
  browseNext = false;
  if (saved && saved.type === code) renderResult(code, saved.pct, 'mine');
  else renderResult(code, null, browsing ? 'browse' : 'shared');
  return true;
}

/* =========================================================
   링크 복사 & 토스트
   ========================================================= */
function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.classList.remove('show'), 1800);
}

function resultUrl() {
  return location.href.split('#')[0] + '#' + $('resultType').textContent;
}

/** 휴대폰 공유 창 열기 (Web Share API). 지원하지 않거나 실패하면 링크 복사로 대신한다. */
async function shareResult() {
  const type = $('resultType').textContent;
  try {
    await navigator.share({
      title: document.title,
      text: `나는 ${type} ${TYPES[type].character}! 너는 어떤 유형이야? 🌈`,
      url: resultUrl()
    });
  } catch (e) {
    if (e.name !== 'AbortError') copyResultLink();   // 사용자가 취소한 경우는 그냥 둔다
  }
}

async function copyResultLink() {
  const url = resultUrl();
  try {
    await navigator.clipboard.writeText(url);
  } catch (e) {
    // clipboard API를 못 쓰는 환경용 대체 방법
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    ta.remove();
  }
  showToast('링크를 복사했어요! 친구에게 공유해봐 💌');
}

/* =========================================================
   배경 장식 생성
   ========================================================= */
function createDecorations() {
  const sky = $('sky');
  const icons = ['⭐', '💖', '☁️', '✨', '🌸', '💫', '💗', '☁️', '🌟'];
  const count = window.innerWidth < 600 ? 14 : 22;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'deco';
    el.textContent = icons[i % icons.length];
    const size = 14 + Math.random() * 22;
    el.style.left = (Math.random() * 100) + '%';
    el.style.fontSize = size + 'px';
    el.style.opacity = (0.3 + Math.random() * 0.35).toFixed(2);
    const dur = 16 + Math.random() * 18;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (-Math.random() * dur) + 's';
    sky.appendChild(el);
  }
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'twinkle';
    s.textContent = '✦';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.fontSize = (8 + Math.random() * 10) + 'px';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    sky.appendChild(s);
  }
}

/* =========================================================
   초기화
   ========================================================= */
$('startBtn').addEventListener('click', startTest);
$('backBtn').addEventListener('click', goBack);
$('retryBtn').addEventListener('click', startTest);
$('copyBtn').addEventListener('click', copyResultLink);
if (navigator.share) {
  $('shareBtn').hidden = false;
  $('shareBtn').addEventListener('click', shareResult);
}
window.addEventListener('hashchange', () => {
  if (!routeFromHash() && !location.hash) showScreen('start');
});

createDecorations();
routeFromHash();
</script>
